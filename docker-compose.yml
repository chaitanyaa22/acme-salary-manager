services:
  postgres:
    image: postgres:16-alpine
    container_name: acme_salary_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: acme_user
      POSTGRES_PASSWORD: acme_password
      POSTGRES_DB: acme_salaries
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme_user -d acme_salaries"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: